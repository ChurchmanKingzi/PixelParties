<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Parties – Statistik</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#12101f;--panel:#1a1a2e;--line:#291f3d;--fg:#e5edfa;--mut:#7e7d9b;--acc:#66b6ff;--gold:#ffe23d;--ok:#75f091;--bad:#ff6666}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;padding:20px max(16px,4vw)}
h1{font-size:20px;margin:0 0 4px}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}select,button{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:7px 10px;font:inherit}
.row{display:grid;grid-template-columns:minmax(150px,280px) 1fr 140px;gap:10px;align-items:center;margin:6px 0}.lab{min-width:0}
.track{background:var(--panel);height:24px;position:relative}.fill{background:var(--acc);height:100%}.row.s-guest .fill{background:#a36afb}.row.s-tut .fill{background:var(--gold)}.row.s-end .fill{background:var(--ok)}
.val{font-variant-numeric:tabular-nums;text-align:right}.val small{color:var(--mut)}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
.wrap{overflow-x:auto}.note{color:var(--mut);font-size:12px;max-width:80ch}.err{color:var(--bad)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:var(--panel);padding:12px 14px}.card b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.card span{color:var(--mut);font-size:12px}
@media(max-width:600px){.row{grid-template-columns:1fr 90px}.track{grid-column:1/3;order:3}}
</style></head><body>
<h1>Pixel Parties – Statistik</h1>
<div id="login" style="display:none;margin:14px 0"><div class="note">Zugangs-Token (steht als <b>FUNNEL_TOKEN</b> in der .env des Servers). Es bleibt nur in diesem Browser.</div>
<div class="bar"><input id="tok" type="password" placeholder="FUNNEL_TOKEN" autocomplete="off" style="background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:7px 10px;font:inherit;min-width:280px"><button id="tokgo">Anmelden</button></div></div>
<h2 style="margin-top:14px">Server jetzt</h2><div id="health" class="cards"></div>
<h2>Spieler-Trichter</h2><div class="note" id="range"></div>
<div class="bar"><label>Zeitraum <select id="days"><option value="1">24 Stunden</option><option value="7" selected>7 Tage</option><option value="14">14 Tage</option><option value="30">30 Tage</option><option value="90">90 Tage</option></select></label><button id="go">Aktualisieren</button><span id="msg" class="note"></span></div>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=(a,b)=>b?(100*a/b).toFixed(1)+' %':'–';
function render(R){
  const land=(R.steps[0]||{}).count||0, S=R.signups;
  $('range').textContent='Zeitraum '+new Date(R.from).toLocaleDateString()+' bis '+new Date(R.to).toLocaleDateString()+' · Tageszähler ohne IDs: Landing = Seitenaufrufe (einmal je Tab-Sitzung), Gast/Tutorial/Gast-Partie je Sitzung bzw. Konto einmal. Es gibt keine eindeutigen Besucher.';
  let h='<div class="cards">'+[['Seitenaufrufe',land],['Konten angelegt',S.total],['Gast-Partien beendet',R.guestGames.games],['davon gewonnen',R.guestGames.wins]].map(([a,b])=>'<div class="card"><b>'+b+'</b><span>'+a+'</span></div>').join('')+'</div>';
  h+='<h2>Trichter</h2>';
  const cls={guest:'s-guest',tutorial_start:'s-tut',cpu_guest:'s-end',signup_submit:'s-end',signup_done:'s-end'};
  for(const s of R.steps){h+='<div class="row '+(cls[s.key]||'')+'"><div class="lab">'+esc(s.label)+'</div><div class="track"><div class="fill" style="width:'+(land?Math.min(100,100*s.count/land):0)+'%"></div></div><div class="val">'+s.count+' <small>'+pc(s.count,land)+'</small></div></div>';}
  h+='<h2>Tutorial-Missionen</h2><div class="wrap"><table><tr><th>Mission</th><th>gestartet (je Sitzung)</th><th>erstmals geschafft (je Konto)</th><th>Quote</th></tr>'+R.tutorial.map(t=>'<tr><td>Mission '+t.n+'</td><td>'+t.started+'</td><td>'+t.completed+'</td><td>'+pc(t.completed,t.started)+'</td></tr>').join('')+'</table></div>';
  h+='<h2>Anmeldungen</h2><div class="cards">'+[['Konten gesamt',S.total],['aus Gast-Sitzung, gespielt',S.viaGuestPlayed],['aus Gast-Sitzung, nichts gespielt',S.viaGuestOnly],['nicht aus Gast-Sitzung',S.direct]].map(([a,b])=>'<div class="card"><b>'+b+'</b><span>'+a+'</span></div>').join('')+'</div><p class="note">Weg: Formular '+S.byMethod.form+' · Gast-Fenster '+S.byMethod.guest_modal+' · Google '+S.byMethod.google+'. Wer als Gast spielt, die Seite schließt und später ein Konto anlegt, zählt als „nicht aus Gast-Sitzung“, denn ohne Wiedererkennung lässt sich das nicht verbinden.</p>';
  const src=Object.entries(R.bySource).sort((a,b)=>(b[1].landing||0)-(a[1].landing||0));
  h+='<h2>Quellen (utm_source oder Referrer-Host der Sitzung)</h2><div class="wrap"><table><tr><th>Quelle</th><th>Landing</th><th>Gast</th><th>Tutorial</th><th>Gast-Partie</th><th>Konto</th><th>Konto / Landing</th></tr>'+src.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+(v.landing||0)+'</td><td>'+(v.guest||0)+'</td><td>'+(v.tutorial_start||0)+'</td><td>'+(v.cpu_guest||0)+'</td><td>'+(v.signup_done||0)+'</td><td>'+pc(v.signup_done||0,v.landing||0)+'</td></tr>').join('')+'</table></div>';
  h+='<p class="note">Geräte (Landing): '+R.devices.map(d=>esc(d.d)+' '+d.c).join(' · ')+'</p>';
  const dm={};R.daily.forEach(r=>{(dm[r.day]=dm[r.day]||{})[r.ev]=r.c});
  h+='<h2>Pro Tag (UTC)</h2><div class="wrap"><table><tr><th>Tag</th><th>Landing</th><th>Gast</th><th>Tutorial</th><th>Konto</th></tr>'+Object.keys(dm).sort().reverse().map(d=>'<tr><td>'+d+'</td><td>'+(dm[d].landing||0)+'</td><td>'+(dm[d].guest_start||0)+'</td><td>'+(dm[d].tutorial_start||0)+'</td><td>'+(dm[d].signup_done||0)+'</td></tr>').join('')+'</table></div>';
  $('out').innerHTML=h;
}
const TK='pp-stats-token';let token='';try{token=localStorage.getItem(TK)||''}catch(e){}
async function health(){ try{const h=await (await fetch('/api/health',{cache:'no-store'})).json();const L=h.loopLagMs||{};
  const ok=(L.p95||0)<100, warm=(L.p95||0)<300;
  $('health').innerHTML=[['Läuft seit',Math.round(h.uptimeS/60)+' min'],['Laufende CPU-Partien',h.cpuAktiv+' / '+h.cpuGrenze],['Server-Verzögerung (p95)',(L.p95||0)+' ms '+(ok?'🟢':warm?'🟡':'🔴')],['Rechenbudget der CPU',Math.round((h.budgetFaktor||1)*100)+' %'],['Speicher',h.rssMb+' MB']].map(([a,b])=>'<div class="card"><b style="font-size:20px">'+b+'</b><span>'+a+'</span></div>').join('');}
  catch(e){$('health').innerHTML='<div class="err">Server nicht erreichbar: '+esc(e.message)+'</div>';} }
async function load(){ health(); $('msg').textContent='lädt …';$('msg').className='note';
  if(!token){$('login').style.display='block';$('out').innerHTML='';$('msg').textContent='';return;}
  try{const to=Date.now(),from=to-Number($('days').value)*86400000;
    const r=await fetch('/api/funnel/report?from='+from+'&to='+to,{headers:{'x-funnel-token':token}});
    if(r.status===404)throw new Error('Auf dem Server ist FUNNEL_TOKEN nicht gesetzt.');
    if(r.status===401){token='';try{localStorage.removeItem(TK)}catch(e){};$('login').style.display='block';throw new Error('Token stimmt nicht.');}
    const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);$('login').style.display='none';render(j);$('msg').textContent='Stand '+new Date().toLocaleTimeString();}
  catch(e){$('msg').textContent=e.message;$('msg').className='err';}}
$('tokgo').onclick=()=>{token=$('tok').value.trim();try{localStorage.setItem(TK,token)}catch(e){};load();};
$('go').onclick=load;$('days').onchange=load;load();setInterval(load,30000);
</script></body></html>
