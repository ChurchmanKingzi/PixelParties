<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pixel Parties TCG</title>
  <meta name="description" content="Assemble your party of Heroes, shape their Abilities and powers - and eliminate the competition! Pixel Parties is a free online multiplayer trading card game.">
  <meta name="theme-color" content="#08060c">

  <!-- Icons / PWA -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Social share preview. Crawlers (Discord/Twitter/…) don't run JS, so
       these URLs must be absolute and live in the served HTML. The base
       below is the production default; the server rewrites it to whatever
       host actually served the page (see serveIndexHtml in server.js), so
       previews resolve from both the live site and local test builds. -->
  <link rel="canonical" href="https://pixelpartiestcg.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pixelpartiestcg.com/">
  <meta property="og:title" content="Pixel Parties TCG">
  <meta property="og:description" content="Assemble your party of Heroes, shape their Abilities and powers - and eliminate the competition!">
  <meta property="og:image" content="https://pixelpartiestcg.com/title.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pixel Parties TCG">
  <meta name="twitter:description" content="Assemble your party of Heroes, shape their Abilities and powers - and eliminate the competition!">
  <meta name="twitter:image" content="https://pixelpartiestcg.com/title.png">

  <!-- Warm up the connections the first paint depends on -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="/data/cards.json" as="fetch" crossorigin>
  <!-- Key art backs both the boot splash and the auth screen — fetch it up front. -->
  <link rel="preload" href="/title.png" as="image">
  <!-- Pixel Intv is the UI font; preload it so the login fields paint in the
       right font on first render instead of a fallback that <input>s keep
       until focused. -->
  <link rel="preload" href="/data/Pixel%20Intv.otf" as="font" type="font/otf" crossorigin>
  <!-- Pixel-Emoji-Schrift: schon beim Seitenaufruf holen UND (Skript unten) fuer die Spiel-Schriften laden, damit das erste Emoji nicht
       einen Moment als weiches System-Emoji aufblitzt, bevor die Pixel-Fassung da ist (siehe scripts/pixel-emoji/README.md). -->
  <link rel="preload" href="/fonts/pp-pixel-emoji.woff2?v=eb2408099f" as="font" type="font/woff2" crossorigin>

  <!-- Strukturierte Daten. Sagt Google, WAS diese Seite ist, statt es
       aus einem Ladebildschirm erraten zu lassen. Die Basis-URL wird
       serverseitig auf den ausliefernden Host umgeschrieben (siehe
       serveIndexHtml), deshalb steht hier dieselbe Vorgabe wie bei den
       og:-Feldern daruber. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Pixel Parties TCG",
    "alternateName": "Pixel Parties",
    "url": "https://pixelpartiestcg.com/",
    "image": "https://pixelpartiestcg.com/title.png",
    "description": "Pixel Parties is a free online trading card game simulator. Build decks from over 1400 cards, duel live opponents in your browser, and climb the ranks.",
    "genre": ["Trading Card Game", "Strategy"],
    "gamePlatform": "Web browser",
    "playMode": ["MultiPlayer", "SinglePlayer"],
    "applicationCategory": "Game",
    "operatingSystem": "Any (web browser)",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "EUR",
      "availability": "https://schema.org/InStock"
    }
  }
  </script>

  <!-- Retro-Modus (Vorschau): ?retro=1 schaltet ein, ?retro=0 aus (wird gemerkt). Laedt die umgewandelten Stylesheets (scripts/retro/build-css.js) und den
       Umwandlungs-Kern fuer Inline-Stile. Muss synchron VOR den Stylesheets laufen. -->
  <script>
    (function () {
      var an = false;
      try {
        var q = /[?&]retro=(\w+)/.exec(location.search);
        if (q) localStorage.setItem('pp-retro', (q[1] === '0' || q[1] === 'aus') ? '0' : '1');
        an = localStorage.getItem('pp-retro') === '1';
      } catch (e) { /* ohne Speicher: normaler Modus */ }
      window.PP_RETRO = an;
      if (an) document.documentElement.setAttribute('data-retro', '1');
      var s = an ? '.retro' : '';
      document.write('<link rel="stylesheet" href="/style' + s + '.css"><link rel="stylesheet" href="/style-skilltest' + s + '.css">');
      if (an) document.write('<script src="/retro-core.js"><\/script>');
    })();
  </script>

  <!-- Instant branded splash, shown until React mounts. Styles are
       inlined so it renders before style.css and never flashes. React
       replaces #root's contents on first render, removing it. -->
  <style>
    /* Boot splash — mirrors .auth-screen so the first paint matches the
       login screen that follows (same key art + translucent panel). Uses
       no web fonts, so there's no font-swap flash before React mounts. */
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background-image: url('/title.png');
      background-size: 100% 100%;
      background-position: center center;
      background-repeat: no-repeat;
      background-color: #08060c;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #boot-splash .bs-panel {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      padding: 28px 44px;
      /* W86u2 (Pixelart): deckende Flaeche, harter Rahmen statt Weichzeichner/Alpha/Rundung. */
      background: #08060c;
      border: 4px solid #7e41ba; border-radius: 0;
      box-shadow: 0 0 0 4px #08060c, 8px 8px 0 4px rgba(0, 0, 0, .6);
    }
    #boot-splash .bs-title {
      font-size: 24px; font-weight: 800; letter-spacing: 6px;
      text-transform: uppercase; color: #1aedff; text-shadow: 2px 2px 0 #405f8c;
    }
    #boot-splash .bs-sub { font-size: 12px; letter-spacing: 4px; color: #7e7d9b; }
    /* W86u2 (Pixelart): Lade-Anzeige aus acht 6-px-Quadraten (Achteck), das helle Quadrat laeuft im Achtertakt — kein gedrehter Vektorring. */
    #boot-splash .bs-ring {
      width: 6px; height: 6px; margin: 16px 0;
      animation: bs-spin .8s steps(1, end) infinite;
    }
    @keyframes bs-spin {
      0% { box-shadow: 0px -14px 0 0 #1aedff, 10px -10px 0 0 #2d4362, 14px 0px 0 0 #2d4362, 10px 10px 0 0 #2d4362, 0px 14px 0 0 #2d4362, -10px 10px 0 0 #2d4362, -14px 0px 0 0 #405f8c, -10px -10px 0 0 #1788bd; }
      12.5% { box-shadow: 0px -14px 0 0 #1788bd, 10px -10px 0 0 #1aedff, 14px 0px 0 0 #2d4362, 10px 10px 0 0 #2d4362, 0px 14px 0 0 #2d4362, -10px 10px 0 0 #2d4362, -14px 0px 0 0 #2d4362, -10px -10px 0 0 #405f8c; }
      25% { box-shadow: 0px -14px 0 0 #405f8c, 10px -10px 0 0 #1788bd, 14px 0px 0 0 #1aedff, 10px 10px 0 0 #2d4362, 0px 14px 0 0 #2d4362, -10px 10px 0 0 #2d4362, -14px 0px 0 0 #2d4362, -10px -10px 0 0 #2d4362; }
      37.5% { box-shadow: 0px -14px 0 0 #2d4362, 10px -10px 0 0 #405f8c, 14px 0px 0 0 #1788bd, 10px 10px 0 0 #1aedff, 0px 14px 0 0 #2d4362, -10px 10px 0 0 #2d4362, -14px 0px 0 0 #2d4362, -10px -10px 0 0 #2d4362; }
      50% { box-shadow: 0px -14px 0 0 #2d4362, 10px -10px 0 0 #2d4362, 14px 0px 0 0 #405f8c, 10px 10px 0 0 #1788bd, 0px 14px 0 0 #1aedff, -10px 10px 0 0 #2d4362, -14px 0px 0 0 #2d4362, -10px -10px 0 0 #2d4362; }
      62.5% { box-shadow: 0px -14px 0 0 #2d4362, 10px -10px 0 0 #2d4362, 14px 0px 0 0 #2d4362, 10px 10px 0 0 #405f8c, 0px 14px 0 0 #1788bd, -10px 10px 0 0 #1aedff, -14px 0px 0 0 #2d4362, -10px -10px 0 0 #2d4362; }
      75% { box-shadow: 0px -14px 0 0 #2d4362, 10px -10px 0 0 #2d4362, 14px 0px 0 0 #2d4362, 10px 10px 0 0 #2d4362, 0px 14px 0 0 #405f8c, -10px 10px 0 0 #1788bd, -14px 0px 0 0 #1aedff, -10px -10px 0 0 #2d4362; }
      87.5% { box-shadow: 0px -14px 0 0 #2d4362, 10px -10px 0 0 #2d4362, 14px 0px 0 0 #2d4362, 10px 10px 0 0 #2d4362, 0px 14px 0 0 #2d4362, -10px 10px 0 0 #405f8c, -14px 0px 0 0 #1788bd, -10px -10px 0 0 #1aedff; }
    }
  </style>

  <!-- Card DB globals must exist before app-shared.js runs. This inline
       script executes at parse time, i.e. before the deferred bundles. -->
  <script>
    window.CARDS_LOADED = false;
    window.ALL_CARDS = [];
    window.CARDS_BY_NAME = {};
    // Public Google OAuth client id, injected by the server (serveIndexHtml).
    // Empty when unconfigured — the auth screen hides the Google button then.
    window.GOOGLE_CLIENT_ID = "__GOOGLE_CLIENT_ID__";
  </script>

  <!-- React 18.3.1 runtime, selbst gehostet (public/vendor) — kein CDN (deferred so the splash paints first). -->
  <!-- Spiel-Palette (256 Farben): rastet Farben, die erst zur Laufzeit entstehen, auf die Palette ein (scripts/palette). Synchron, vor allem anderen. -->
  <script src="/palette.js"></script>
  <!-- W86z: Pixel-Animation (Takt, Dither-Fade, Kunstpixel-Skalierung, Drehsprites) — nach palette.js, vor den Bundles -->
  <script src="/pixel-anim.js"></script>
  <!-- W86u1: weiche Schatten/Filter (box-/text-shadow, filter: blur/drop-shadow, backdrop-filter, mix-blend-mode) in Stylesheets und Inline-Stilen → harte Pixelkanten -->
  <script src="/pixel-hart.js"></script>
  <script defer src="/vendor/react.production.min.js"></script>
  <script defer src="/vendor/react-dom.production.min.js"></script>
  <script defer src="/socket.io/socket.io.js"></script>

  <!-- Pre-compiled app bundles (built from public/*.jsx by scripts/build.js).
       Loaded in the same order the old text/babel scripts ran; defer
       preserves that order and runs them after the document parses. -->
  <!-- Shared profanity filter (also require()d by the server). Plain script
       so it sets window.Profanity / window.containsProfanity before the
       bundles run. -->
  <script defer src="/profanity.js"></script>
  <!-- Potion-Deck-Klauseln der Helden (Chaos-Diamond, Pinta): eine Tabelle fuer Deckbau und
       Server (wird dort ebenfalls require()d). Setzt window.PotionDeckClauses vor den Bundles. -->
  <script defer src="/potion-deck-clauses.js"></script>
  <!-- Karten entstehen zur Laufzeit (Rahmen + Kunst-Atlas + Schrift) statt als 1.200 fertige PNGs.
       card-render.js zeichnet, card-image-shim.js haengt es an die <img>-Quellen /cards/…. -->
  <script defer src="/card-render.js"></script>
  <script defer src="/card-image-shim.js"></script>
  <script defer src="/dist/app-shared.js"></script>
  <script defer src="/dist/app-areas.js"></script>
  <script defer src="/dist/app-screens.js"></script>
  <script defer src="/dist/app-player-profile.js"></script>
  <script defer src="/dist/app-social.js"></script>
  <script defer src="/dist/app-puzzle.js"></script>
  <script defer src="/dist/app-deckbuilder.js"></script>
  <script defer src="/dist/app-board.js"></script>
  <script defer src="/dist/app-fx-0.js"></script>
  <script defer src="/dist/app-fx-1.js"></script>
  <script defer src="/dist/app-fx-2.js"></script>
  <script defer src="/dist/app-fx-3.js"></script>
  <script defer src="/dist/app-fx-4.js"></script>
  <script defer src="/dist/app-fx-5.js"></script>
  <script defer src="/dist/app-fx-6.js"></script>
  <script defer src="/dist/app-fx-7.js"></script>
  <script defer src="/dist/app-fx-8.js"></script>
  <script defer src="/dist/app-campaign.js"></script>
  <script defer src="/skilltest-rules.js"></script>
  <script defer src="/skilltest-art.js"></script>
  <script defer src="/dist/app-skilltest.js"></script>
  <script defer src="/dist/app-main.js"></script>
  <script>
    // Pixel-Emoji-Schrift sofort anfordern (unicode-range-Schriften laden sonst erst beim ersten Zeichen im Text). Die Zeichen sind Stichproben aus
    // den Bereichen der Schrift (Emoji, Pfeile, Symbole); `document.fonts.load` holt jede Schrift, die eines davon abdeckt.
    (function () {
      if (!document.fonts || !document.fonts.load) return;
      var familien = ['PP Pixel Emoji', 'Pixel Intv', 'Press Start 2P'];
      var probe = '\uD83D\uDD25\u2605\u2192\u2694\u2728';
      function los() { familien.forEach(function (f) { try { document.fonts.load("16px '" + f + "'", probe).catch(function () {}); } catch (e) {} }); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', los); else los();
    })();
  </script>
</head>
<body>
  <div id="root">
    <div id="boot-splash">
      <div class="bs-panel">
        <div class="bs-title">Pixel Parties</div>
        <div class="bs-ring"></div>
        <div class="bs-sub">LOADING…</div>
      </div>
    </div>
  </div>
</body>
</html>
