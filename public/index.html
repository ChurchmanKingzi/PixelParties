<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pixel Parties TCG</title>
  <meta name="description" content="Pixel Parties — an online multiplayer Trading Card Game simulator. Build decks, duel live opponents, and climb the ranks.">
  <meta name="theme-color" content="#0a0a12">

  <!-- Icons / PWA -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Social share preview. Crawlers (Discord/Twitter/…) don't run JS, so
       these URLs must be absolute and live in the served HTML. The base
       below is the production default; the server rewrites it to whatever
       host actually served the page (see serveIndexHtml in server.js), so
       previews resolve from both the live site and local test builds. -->
  <link rel="canonical" href="https://pixelparties.onrender.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pixelparties.onrender.com/">
  <meta property="og:title" content="Pixel Parties TCG">
  <meta property="og:description" content="Build decks, duel live opponents, and climb the ranks in the Pixel Parties online TCG simulator.">
  <meta property="og:image" content="https://pixelparties.onrender.com/title.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pixel Parties TCG">
  <meta name="twitter:description" content="Build decks, duel live opponents, and climb the ranks in the Pixel Parties online TCG simulator.">
  <meta name="twitter:image" content="https://pixelparties.onrender.com/title.png">

  <!-- Warm up the connections the first paint depends on -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="/data/cards.json" as="fetch" crossorigin>
  <!-- Key art backs both the boot splash and the auth screen — fetch it up front. -->
  <link rel="preload" href="/title.png" as="image">
  <!-- Pixel Intv is the UI font; preload it so the login fields paint in the
       right font on first render instead of a fallback that <input>s keep
       until focused. -->
  <link rel="preload" href="/data/Pixel%20Intv.otf" as="font" type="font/otf" crossorigin>

  <!-- Strukturierte Daten. Sagt Google, WAS diese Seite ist, statt es
       aus einem Ladebildschirm erraten zu lassen. Die Basis-URL wird
       serverseitig auf den ausliefernden Host umgeschrieben (siehe
       serveIndexHtml), deshalb steht hier dieselbe Vorgabe wie bei den
       og:-Feldern daruber. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Pixel Parties TCG",
    "alternateName": "Pixel Parties",
    "url": "https://pixelparties.onrender.com/",
    "image": "https://pixelparties.onrender.com/title.png",
    "description": "Pixel Parties is a free online trading card game simulator. Build decks from over 1400 cards, duel live opponents in your browser, and climb the ranks.",
    "genre": ["Trading Card Game", "Strategy"],
    "gamePlatform": "Web browser",
    "playMode": ["MultiPlayer", "SinglePlayer"],
    "applicationCategory": "Game",
    "operatingSystem": "Any (web browser)",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "EUR",
      "availability": "https://schema.org/InStock"
    }
  }
  </script>

  <link rel="stylesheet" href="/style.css">

  <!-- Instant branded splash, shown until React mounts. Styles are
       inlined so it renders before style.css and never flashes. React
       replaces #root's contents on first render, removing it. -->
  <style>
    /* Boot splash — mirrors .auth-screen so the first paint matches the
       login screen that follows (same key art + translucent panel). Uses
       no web fonts, so there's no font-swap flash before React mounts. */
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background-image: url('/title.png'), linear-gradient(135deg, #0a0a12 0%, #1a0a2e 50%, #0a1a1e 100%);
      background-size: 100% 100%, auto;
      background-position: center center, center center;
      background-repeat: no-repeat, no-repeat;
      background-color: #050510;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #boot-splash .bs-panel {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      padding: 28px 44px;
      background: rgba(10, 10, 20, .82);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(170, 136, 255, .35); border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 0, 0, .75), 0 0 60px rgba(170, 136, 255, .15);
    }
    #boot-splash .bs-title {
      font-size: 24px; font-weight: 800; letter-spacing: 6px;
      text-transform: uppercase; color: #00f0ff; text-shadow: 0 0 24px rgba(0,240,255,.55);
    }
    #boot-splash .bs-sub { font-size: 12px; letter-spacing: 4px; color: #8888aa; }
    #boot-splash .bs-ring {
      width: 38px; height: 38px; border-radius: 50%;
      border: 3px solid rgba(0,240,255,.18); border-top-color: #00f0ff;
      animation: bs-spin .8s linear infinite;
    }
    @keyframes bs-spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Card DB globals must exist before app-shared.js runs. This inline
       script executes at parse time, i.e. before the deferred bundles. -->
  <script>
    window.CARDS_LOADED = false;
    window.ALL_CARDS = [];
    window.CARDS_BY_NAME = {};
    // Public Google OAuth client id, injected by the server (serveIndexHtml).
    // Empty when unconfigured — the auth screen hides the Google button then.
    window.GOOGLE_CLIENT_ID = "__GOOGLE_CLIENT_ID__";
  </script>

  <!-- React runtime (deferred so the splash paints first). -->
  <script defer src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script defer src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script defer src="/socket.io/socket.io.js"></script>

  <!-- Pre-compiled app bundles (built from public/*.jsx by scripts/build.js).
       Loaded in the same order the old text/babel scripts ran; defer
       preserves that order and runs them after the document parses. -->
  <!-- Shared profanity filter (also require()d by the server). Plain script
       so it sets window.Profanity / window.containsProfanity before the
       bundles run. -->
  <script defer src="/profanity.js"></script>
  <script defer src="/dist/app-shared.js"></script>
  <script defer src="/dist/app-screens.js"></script>
  <script defer src="/dist/app-puzzle.js"></script>
  <script defer src="/dist/app-deckbuilder.js"></script>
  <script defer src="/dist/app-board.js"></script>
  <script defer src="/dist/app-campaign.js"></script>
  <script defer src="/dist/app-main.js"></script>
</head>
<body>
  <div id="root">
    <div id="boot-splash">
      <div class="bs-panel">
        <div class="bs-title">Pixel Parties</div>
        <div class="bs-ring"></div>
        <div class="bs-sub">LOADING…</div>
      </div>
    </div>
  </div>
</body>
</html>
