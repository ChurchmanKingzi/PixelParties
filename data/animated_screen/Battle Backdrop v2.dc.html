<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1a1020; overflow: hidden; }
    *, *::before, *::after { box-sizing: border-box; }

    @keyframes floaty {
      0%   { transform: translate(0,0) rotate(0deg); }
      50%  { transform: translate(calc(var(--mx,0px) * var(--pf,1)), calc(var(--my,-10px) * var(--pf,1))) rotate(calc(var(--mr,0deg) * var(--pf,1))); }
      100% { transform: translate(0,0) rotate(0deg); }
    }
    @keyframes loom {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(calc(-6px * var(--pf,1)), calc(-4px * var(--pf,1))) scale(calc(1 + 0.02 * var(--pf,1))); }
      100% { transform: translate(0,0) scale(1); }
    }
    /* Core throbs via light only (brightness/opacity) — never scales, so its
       tips stay locked to the two baked-in beams at all times. */
    @keyframes corepulse {
      0%   { opacity: 1;   filter: brightness(calc(1 + 0.03 * var(--ef,1))) saturate(calc(1 + 0.10 * var(--ef,1))); }
      6%   { opacity: .96; filter: brightness(1) saturate(calc(1 + 0.06 * var(--ef,1))); }
      15%  { opacity: 1;   filter: brightness(calc(1 + 0.015 * var(--ef,1))) saturate(calc(1 + 0.07 * var(--ef,1))); }
      42%  { opacity: .99; filter: brightness(calc(1 + 0.01 * var(--ef,1))) saturate(calc(1 + 0.07 * var(--ef,1))); }
      50%  { opacity: 1;   filter: brightness(calc(1 + 0.06 * var(--ef,1))) saturate(calc(1 + 0.12 * var(--ef,1))); }
      57%  { opacity: .96; filter: brightness(1) saturate(calc(1 + 0.06 * var(--ef,1))); }
      66%  { opacity: 1;   filter: brightness(calc(1 + 0.015 * var(--ef,1))) saturate(calc(1 + 0.07 * var(--ef,1))); }
      100% { opacity: 1;   filter: brightness(calc(1 + 0.03 * var(--ef,1))) saturate(calc(1 + 0.10 * var(--ef,1))); }
    }
    @keyframes shake {
      0%, 6%, 49%, 56%, 100% { transform: translate(0, 0); }
      1%  { transform: translate(calc(-8px * var(--shake,1)), calc(5px * var(--shake,1))); }
      2%  { transform: translate(calc(7px * var(--shake,1)), calc(-6px * var(--shake,1))); }
      3%  { transform: translate(calc(-5px * var(--shake,1)), calc(4px * var(--shake,1))); }
      4%  { transform: translate(calc(3px * var(--shake,1)), calc(-3px * var(--shake,1))); }
      50% { transform: translate(calc(9px * var(--shake,1)), calc(-6px * var(--shake,1))); }
      51% { transform: translate(calc(-8px * var(--shake,1)), calc(6px * var(--shake,1))); }
      52% { transform: translate(calc(6px * var(--shake,1)), calc(-4px * var(--shake,1))); }
      53% { transform: translate(calc(-4px * var(--shake,1)), calc(3px * var(--shake,1))); }
      54% { transform: translate(calc(2px * var(--shake,1)), calc(-2px * var(--shake,1))); }
    }
    @keyframes glowpulse {
      0%   { opacity: .6;  transform: translate(-50%,-50%) scale(1.02); }
      4%   { opacity: 1;   transform: translate(-50%,-50%) scale(1.18); }
      16%  { opacity: .4;  transform: translate(-50%,-50%) scale(.98); }
      42%  { opacity: .52; transform: translate(-50%,-50%) scale(1.02); }
      50%  { opacity: 1;   transform: translate(-50%,-50%) scale(1.2); }
      62%  { opacity: .4;  transform: translate(-50%,-50%) scale(.98); }
      100% { opacity: .6;  transform: translate(-50%,-50%) scale(1.02); }
    }
    @keyframes flashburst {
      0%, 49%, 56%, 100% { opacity: 0; }
      1%  { opacity: calc(.45 * var(--shake,1)); }
      5%  { opacity: 0; }
      50% { opacity: calc(.4 * var(--shake,1)); }
      54% { opacity: 0; }
    }
    @keyframes vignettepulse {
      0%, 100% { opacity: .5; }
      50%      { opacity: .72; }
    }
    @keyframes glowflick {
      0%, 100% { opacity: .8; }
      50%      { opacity: 1; }
    }
    /* --- Tethered laser-clash rig ---------------------------------------
       Broghan sits flush against the right edge, so its start IS its rightmost
       position — it can only travel inward (left) and back. So REST (0%/100%)
       is the fully-apart state: Broghan at the edge, Jiggles at its natural
       spot, explosion at full size. The single mid-point (50%) is the inward
       squeeze — Jiggles right, Broghan left (exact mirror), explosion
       constricted. One clock, zero delay -> perfect phase; the core scales on
       the same clock so its edges always bridge the two beam tips; a shared
       vertical bob keeps the assembly rigid. --tH horizontal, --tV vertical,
       --sAmp core scale; all gated by --pf (parallax). */
    @keyframes jiggleTether {
      0%, 100% { transform: translate(0, 0); }
      50%  { transform: translate(calc(var(--tH,9px) * var(--pf,1)), calc(var(--tV,4px) * var(--pf,1))); }        /* inward -> right + down */
    }
    @keyframes broghanTether {
      0%, 100% { transform: translate(0, 0); }
      50%  { transform: translate(calc(var(--tH,9px) * -1 * var(--pf,1)), calc(var(--tV,4px) * var(--pf,1))); }   /* inward -> left + down (never right of start) */
    }
    @keyframes coreTether {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(0, calc(var(--tV,4px) * var(--pf,1))) scale(calc(1 - var(--sAmp,0.021) * var(--pf,1))); }  /* constrict */
    }
    @keyframes emberrise {
      0%   { transform: translateY(20px) translateX(0); opacity: 0; }
      8%   { opacity: .95; }
      78%  { opacity: .7; }
      100% { transform: translateY(-112vh) translateX(var(--drift, 0px)); opacity: 0; }
    }
  </style>
</helmet>

<div style="position:fixed; inset:0; overflow:hidden; background:#1a1020; --pf:{{ pf }}; --shake:{{ shakeAmt }}; --ef:{{ ef }}; --tH:9px; --tV:4px; --sAmp:0.021;">

  <div style="position:absolute; inset:0; animation:shake 10s steps(1,end) infinite; will-change:transform;">

    <!-- clean background plate -->
    <div style="position:absolute; inset:-2%; background:url('layers2/background.png') center/cover no-repeat;"></div>

    <!-- hammer girl (behind central laser, golem + beams) -->
    <div style="position:absolute; inset:0; background:url('layers2/hammer.png') center/cover no-repeat; transform-origin:72% 28%; --mx:9px; --my:-15px; --mr:2deg; animation:floaty 4.2s ease-in-out -0.6s infinite; will-change:transform;"></div>

    <!-- explosion burst core (behind reaching limbs) — opacity 100% and color constant at all times (matches Broghan's beam). It only SCALES, on the same clock as the two beam-carriers, so its edges always touch both incoming beams. transform-origin at burst center. -->
    <div style="position:absolute; inset:0; background:url('layers2/explosion.png') center/cover no-repeat; transform-origin:52% 42%; animation:coreTether 4.8s ease-in-out infinite; will-change:transform;"></div>

    <!-- central bloom -->
    <div style="position:absolute; left:52%; top:42%; width:860px; height:860px; border-radius:50%; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(255,228,150,.4), rgba(255,152,72,.12) 22%, rgba(255,96,74,.03) 40%, transparent 56%); filter:blur(9px); mix-blend-mode:screen; pointer-events:none; animation:glowpulse 10s ease-in-out infinite; will-change:transform,opacity;"></div>

    <!-- Broghan (back-right) — carries the RIGHT laser beam. Tethered: mirrors Jiggles horizontally, on the shared clock. Wrapper nudges him ~111px right and ~6px up as his default resting position. -->
    <div style="position:absolute; inset:0; transform:translate(111px, -6px);">
      <div style="position:absolute; inset:0; background:url('layers2/golem.png') center/cover no-repeat; animation:broghanTether 4.8s ease-in-out infinite; will-change:transform;"></div>
    </div>

    <!-- tree girl (front of giant) — wrapper shifts her 161px down -->
    <div style="position:absolute; inset:0; transform:translateY(161px);">
      <div style="position:absolute; inset:0; background:url('layers2/horned.png') center/cover no-repeat; transform-origin:80% 100%; --mx:-11px; --my:-15px; --mr:2.6deg; animation:floaty 6s ease-in-out -2s infinite; will-change:transform;"></div>
    </div>

    <!-- angel girl (back-left) -->
    <div style="position:absolute; inset:0; background:url('layers2/angel.png') center/cover no-repeat; transform-origin:20% 30%; --mx:0px; --my:-12px; --mr:-1.4deg; animation:floaty 5s ease-in-out infinite; will-change:transform;"></div>

    <!-- blonde girl (front of angel) -->
    <div style="position:absolute; inset:0; background:url('layers2/blonde.png') center/cover no-repeat; transform-origin:20% 50%; --mx:4px; --my:-9px; --mr:1deg; animation:floaty 6.5s ease-in-out -1.5s infinite; will-change:transform;"></div>

    <!-- Jiggles (front of blonde) — carries the LEFT laser beam. Tethered: mirror of Broghan, on the shared clock. -->
    <div style="position:absolute; inset:0; background:url('layers2/rabbit.png') center/cover no-repeat; animation:jiggleTether 4.8s ease-in-out infinite; will-change:transform;"></div>

    <!-- swordsman (front-left) — wrapper shifts him 215px down -->
    <div style="position:absolute; inset:0; transform:translateY(215px);">
      <div style="position:absolute; inset:0; background:url('layers2/ninja.png') center/cover no-repeat; transform-origin:16% 80%; --mx:8px; --my:-14px; --mr:-2deg; animation:floaty 5.5s ease-in-out -2.5s infinite; will-change:transform;"></div>
    </div>

    <!-- flying cats (in front of angel/blonde) — split into 3 sprites, each floating independently -->
    <div style="position:absolute; inset:0; background:url('layers2/cat_top.png') center/cover no-repeat; transform-origin:23% 5%; --mx:14px; --my:-9px; --mr:3deg; animation:floaty 3.4s ease-in-out -0.5s infinite; will-change:transform;"></div>
    <div style="position:absolute; inset:0; background:url('layers2/cat_mid.png') center/cover no-repeat; transform-origin:37% 30%; --mx:-11px; --my:9px; --mr:-3deg; animation:floaty 2.9s ease-in-out -0.8s infinite; will-change:transform;"></div>
    <div style="position:absolute; inset:0; background:url('layers2/cat_bottom.png') center/cover no-repeat; transform-origin:5% 48%; --mx:16px; --my:-12px; --mr:4deg; animation:floaty 3.0s ease-in-out -1.7s infinite; will-change:transform;"></div>


    <!-- embers -->
    <sc-if value="{{ embersOn }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; pointer-events:none; overflow:hidden;">
        <sc-for list="{{ embers }}" as="ember" hint-placeholder-count="0">
          <span style="{{ ember.style }}"></span>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <!-- impact flash (stable) -->
  <div style="position:absolute; inset:0; background:radial-gradient(circle at 56% 41%, #fff, rgba(255,240,200,.55) 30%, transparent 58%); mix-blend-mode:screen; pointer-events:none; animation:flashburst 10s steps(1,end) infinite;"></div>

  <!-- vignette -->
  <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 44%, transparent 40%, rgba(20,8,20,.4) 80%, rgba(15,5,18,.64) 100%); animation:vignettepulse 6s ease-in-out infinite;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2.5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;explosion&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;screenShake&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;showEmbers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const colors = ['#ffd36b', '#ff8a3d', '#ff5a4d', '#ffe9a8', '#ffffff'];
    const embers = Array.from({ length: 46 }, () => {
      const size = 2 + Math.random() * 5;
      const dur = 7 + Math.random() * 9;
      const delay = -Math.random() * 16;
      const left = Math.random() * 100;
      const drift = Math.round((Math.random() * 2 - 1) * 50);
      const c = colors[Math.floor(Math.random() * colors.length)];
      return {
        style: `position:absolute; bottom:-14px; left:${left.toFixed(2)}%; width:${size.toFixed(1)}px; height:${size.toFixed(1)}px; border-radius:50%; background:${c}; box-shadow:0 0 ${(size * 2.4).toFixed(1)}px ${c}; opacity:0; animation:emberrise ${dur.toFixed(1)}s linear ${delay.toFixed(1)}s infinite; --drift:${drift}px;`
      };
    });
    const num = (v, d) => (typeof v === 'number' ? v : d);
    return {
      embers,
      embersOn: this.props.showEmbers !== false,
      pf: num(this.props.parallax, 1),
      ef: num(this.props.explosion, 1),
      shakeAmt: this.props.screenShake === false ? 0 : 1
    };
  }
}
</script>
</body>
</html>
