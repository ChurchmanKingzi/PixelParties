<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Parties</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Pixel Parties — Desktop-Startseite (Launcher).
  Wird vom Electron-Fenster zuerst geladen (electron/main.js); „PLAY“ lädt dann das Spiel vom Server. Alles Pixelart: die Kulisse ist die animierte Titelkulisse des Spiels
  (assets/scene, scripts/electron/build_assets.py), Bewegung in ganzen Pixeln (steps), harte Rahmen aus Schatten-Ringen, keine Weichzeichner, nur Palettenfarben.
  Inhalte (Links, Neuigkeiten) stehen in launcher-config.json. Ohne Electron (Browser-Test) arbeitet eine Attrappe `ppLauncher`.
-->
<style>
  @font-face { font-family: 'PP Pixel'; src: url('assets/fonts/PixelIntv.otf'); }
  :root { --px: 3px; --u: 16px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08060c; color: #ffffff; font-family: 'PP Pixel', monospace; user-select: none; cursor: default; }
  img, canvas { image-rendering: pixelated; }

  /* ── Kulisse: 1920×1080-Bühne, per JS auf das Fenster gestreckt (Deckung, Mitte) ── */
  #art { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #art img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  #art img.bg { left: -39px; top: -22px; width: 1998px; height: 1125px; }
  /* Figuren: Grundversatz (--bx/--by) + Schweben/Kette (--mx/--my), Bewegung in ganzen Pixelstufen (steps). Die Kämpfer an der Laserkette
     (golem, rabbit) und der Explosionskern laufen im selben Takt (4,8 s) wie in der Titelkulisse des Spiels, damit die Laser nie abreißen. */
  .f { transform: translate(var(--bx, 0px), var(--by, 0px)); animation: f var(--d, 5s) steps(var(--n, 10)) infinite alternate; animation-delay: var(--z, 0s); will-change: transform; }
  @keyframes f { to { transform: translate(calc(var(--bx, 0px) + var(--mx, 0px)), calc(var(--by, 0px) + var(--my, 0px))) scale(var(--sc, 1)); } }
  .f.core { transform-origin: 1046px 410px; }
  #embers { position: fixed; inset: 0; pointer-events: none; }
  #vig { position: fixed; inset: 0; background: url('assets/vignette.png') center / cover; }

  /* ── Oberfläche ── */
  .ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(var(--u) * 1.4) calc(var(--u) * 2) calc(var(--u) * 1.4); }
  #logo { width: min(40vw, calc(var(--u) * 38)); margin-top: calc(var(--u) * .6); animation: bob 2.4s steps(4) infinite alternate; filter: drop-shadow(0 calc(var(--px) * 2) 0 #08060c); }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(calc(var(--px) * -2)); } }
  .mid { flex: 1; }
  .bottom { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: calc(var(--u) * 1.4); }
  .center { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .8); }

  /* PLAY: goldene Taste mit abgestuften Ecken, heller Oberkante, dunkler Unterkante, blauem Rahmen; ein heller Streifen läuft in Pixelstufen darüber */
  .playwrap { filter: drop-shadow(var(--px) 0 0 #08060c) drop-shadow(calc(var(--px) * -1) 0 0 #08060c) drop-shadow(0 var(--px) 0 #08060c) drop-shadow(0 calc(var(--px) * -1) 0 #08060c) drop-shadow(0 calc(var(--px) * 2) 0 #08060c);
    margin-bottom: calc(var(--u) * .2); }
  #play { --n: calc(var(--px) * 3); appearance: none; border: 0; cursor: pointer; font-family: inherit; position: relative; overflow: hidden; display: block;
    color: #12101f; background: #fad54a; font-size: calc(var(--u) * 2.5); letter-spacing: .2em; text-indent: .2em; padding: calc(var(--u) * .85) calc(var(--u) * 5.2);
    border: calc(var(--px) * 2) solid #66b6ff;
    box-shadow: inset 0 calc(var(--px) * 2) 0 #f7f7ad, inset 0 calc(var(--px) * -3) 0 #c68206, inset calc(var(--px) * 2) 0 0 #f7f7ad, inset calc(var(--px) * -2) 0 0 #c68206;
    clip-path: polygon(0 var(--n), var(--px) var(--n), var(--px) var(--px), var(--n) var(--px), var(--n) 0, calc(100% - var(--n)) 0, calc(100% - var(--n)) var(--px), calc(100% - var(--px)) var(--px), calc(100% - var(--px)) var(--n), 100% var(--n),
      100% calc(100% - var(--n)), calc(100% - var(--px)) calc(100% - var(--n)), calc(100% - var(--px)) calc(100% - var(--px)), calc(100% - var(--n)) calc(100% - var(--px)), calc(100% - var(--n)) 100%, var(--n) 100%, var(--n) calc(100% - var(--px)), var(--px) calc(100% - var(--px)), var(--px) calc(100% - var(--n)), 0 calc(100% - var(--n))); }
  #play::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: calc(var(--px) * 4); background: #ffffff; transform: translateX(-200%); animation: shine 3.2s steps(24) infinite; }
  @keyframes shine { 0%, 55% { transform: translateX(-300%); } 100% { transform: translateX(var(--shine-end, 1200%)); } }
  #play:hover { background: #f7f7ad; border-color: #b3d8f9; }
  #play:active { transform: translateY(var(--px)); }

  .pitch { appearance: none; border: 0; cursor: pointer; font-family: inherit; color: #e5edfa; background: #12101f; font-size: calc(var(--u) * .85); letter-spacing: .06em; line-height: 1.45; text-align: center;
    padding: calc(var(--u) * .5) calc(var(--u) * 1.1); max-width: calc(var(--u) * 34); box-shadow: 0 0 0 var(--px) #08060c, 0 0 0 calc(var(--px) * 2) #3e3e51; }
  .pitch b { color: #66b6ff; font-weight: 400; }
  .pitch:hover { background: #243a8a; }
  .pitch[hidden] { display: none; }

  .row { display: flex; gap: calc(var(--u) * .7); justify-content: center; }
  .btn { appearance: none; border: 0; cursor: pointer; font-family: inherit; color: #ffffff; background: #12101f; font-size: calc(var(--u) * .85); letter-spacing: .1em; padding: calc(var(--u) * .5) 0; width: calc(var(--u) * 8.6); text-align: center;
    box-shadow: 0 0 0 var(--px) #08060c, 0 0 0 calc(var(--px) * 2) #3e3e51; }
  .btn:hover { color: #12101f; background: #66b6ff; box-shadow: 0 0 0 var(--px) #08060c, 0 0 0 calc(var(--px) * 2) #b3d8f9; }
  .btn[hidden] { display: none; }

  .status { white-space: nowrap; display: flex; align-items: center; gap: calc(var(--u) * .6); font-size: calc(var(--u) * .85); letter-spacing: .08em; background: #12101f; padding: calc(var(--u) * .4) calc(var(--u) * .8); align-self: flex-start; box-shadow: 0 0 0 var(--px) #08060c, 0 0 0 calc(var(--px) * 2) #3e3e51; }
  .dot { width: calc(var(--px) * 4); height: calc(var(--px) * 4); background: #7e7d9b; box-shadow: 0 0 0 var(--px) #08060c; }
  .ok .dot { background: #66ffa2; } .wake .dot { background: #fad54a; animation: arr .8s steps(1) infinite; } .bad .dot { background: #fe5154; }
  .foot { font-size: calc(var(--u) * .7); color: #a5b0c0; letter-spacing: .1em; text-shadow: var(--px) var(--px) 0 #08060c; }
  .left { display: flex; align-items: flex-end; } .right { display: flex; align-items: flex-end; justify-content: flex-end; }

  /* Verbinden-Ansicht */
  #go { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: calc(var(--u) * 1.4); background: #08060c; z-index: 10; }
  #go.on { display: flex; }
  #go .t { font-size: calc(var(--u) * 2); letter-spacing: .2em; color: #fad54a; }
  #go .bar { width: calc(var(--u) * 24); height: calc(var(--u) * 1.4); background: #12101f; box-shadow: 0 0 0 var(--px) #08060c, 0 0 0 calc(var(--px) * 2) #66b6ff; position: relative; overflow: hidden; }
  #go .bar i { position: absolute; top: 0; bottom: 0; width: 25%; background: #fad54a; animation: bar 1.4s steps(14) infinite; }
  @keyframes bar { from { left: -25%; } to { left: 100%; } }
  #go .s { font-size: calc(var(--u) * .85); color: #a5b0c0; letter-spacing: .08em; max-width: calc(var(--u) * 30); text-align: center; line-height: 1.5; }

  @media (max-width: 1000px) { .bottom { grid-template-columns: 1fr; justify-items: center; } .left, .right { display: none; } }
</style>
</head>
<body>
<div id="art">
  <img class="bg" src="assets/scene/background.png" alt="">
  <!-- Laserkette: Rabbit, Explosion und Golem tragen vorgeschnittene Laserstücke (senkrechte Schnittkanten), die nur in EINER Lage nahtlos aufeinandertreffen:
       Rabbit und Explosion mit gleichem Versatz, der Golem exakt +111 px (5,781 vw, wie in der Titelkulisse) rechts davon — dort ist der Strahl des Golems
       (y 339–410) genauso dick wie die Spitze der Explosion. Alle drei teilen den Grundversatz E (-70) und laufen im selben Takt; nie einzeln verschieben!
       Reihenfolge wie in der Titelkulisse (hinten → vorn); der Ninja (unten links) liegt zuoberst, über Blonde und Engel. -->
  <img class="f" style="--bx:120px;--by:40px;--mx:9px;--my:-15px;--d:2.1s;--n:12" src="assets/scene/hammer.png" alt="">
  <img class="f core" style="--bx:-70px;--my:4px;--sc:1.021;--d:2.4s;--n:8" src="assets/scene/explosion.png" alt="">
  <img class="f" style="--bx:41px;--by:3px;--mx:-9px;--my:4px;--d:2.4s;--n:8" src="assets/scene/golem.png" alt="">
  <img class="f" style="--bx:40px;--by:161px;--mx:-11px;--my:-15px;--d:3s;--n:12;--z:-1s" src="assets/scene/horned.png" alt="">
  <img class="f" style="--bx:-100px;--by:60px;--my:-12px;--d:2.5s;--n:10" src="assets/scene/angel.png" alt="">
  <img class="f" style="--bx:-70px;--mx:4px;--my:-9px;--d:3.25s;--n:10;--z:-.7s" src="assets/scene/blonde.png" alt="">
  <img class="f" style="--bx:-70px;--mx:9px;--my:4px;--d:2.4s;--n:8" src="assets/scene/rabbit.png" alt="">
  <img class="f" style="--bx:-30px;--by:215px;--mx:8px;--my:-14px;--d:2.75s;--n:12;--z:-1.2s" src="assets/scene/ninja.png" alt="">
  <img class="f" style="--mx:36px;--my:-14px;--d:7s;--n:16" src="assets/scene/cat_mid.png" alt="">
  <img class="f" style="--mx:36px;--my:-14px;--d:9s;--n:18;--z:-3s" src="assets/scene/cat_top.png" alt="">
  <img class="f" style="--mx:36px;--my:-14px;--d:7s;--n:16;--z:-2s" src="assets/scene/cat_bottom.png" alt="">
</div>
<canvas id="embers"></canvas>
<div id="vig"></div>

<div class="ui">
  <div style="display:flex;flex-direction:column;align-items:center">
    <img id="logo" src="assets/logo.png" alt="Pixel Parties">
  </div>
  <div class="mid"></div>
  <div class="bottom">
    <div class="left"><div style="display:flex;flex-direction:column;gap:calc(var(--u)*.6)">
      <div class="status" id="status"><span class="dot"></span><span id="stxt">Checking server…</span></div>
    </div></div>
    <div class="center">
      <div class="playwrap"><button id="play">PLAY</button></div>
      <button class="pitch" id="pitch" hidden>Join our <b>Discord</b> to find opponents, share your decks, and see more news!</button>
      <div class="row">
        <button class="btn" id="b-discord" hidden>DISCORD</button>
        <button class="btn" id="b-web" hidden>IN BROWSER</button>
        <button class="btn" id="b-itch" hidden>ITCH.IO</button>
      </div>
      <div class="row">
        <button class="btn" id="b-music">MUSIC: ON</button>
        <button class="btn" id="b-full">FULLSCREEN</button>
        <button class="btn" id="b-quit">QUIT</button>
      </div>
    </div>
    <div class="right"><div class="foot" id="ver"></div></div>
  </div>
</div>

<audio id="bgm" src="assets/music/title.ogg" loop preload="auto"></audio>
<div id="go"><div class="t">CONNECTING</div><div class="bar"><i></i></div><div class="s" id="gos">Entering the Pixel Parties…</div></div>

<script>
(() => {
  // ── Brücke zu Electron (preload.js); im Browser eine Attrappe ──
  const L = window.ppLauncher || {
    config: async () => ({ version: 'dev', serverUrl: '', links: { discord: 'x', website: 'x' } }),
    status: async () => ({ state: 'ok', ms: 42 }),
    play: () => { document.getElementById('gos').textContent = '(preview: no game server attached)'; },
    openExternal: () => {}, toggleFullscreen: () => {}, quit: () => {}, onPlayFailed: () => {},
  };
  const $ = (id) => document.getElementById(id);

  // ── Maßstab: Zelle (--px) und Einheit (--u) folgen der Fensterhöhe; die Bühne deckt das Fenster ab ──
  const art = $('art'), cv = $('embers'), g = cv.getContext('2d');
  const fit = () => {
    const w = innerWidth, h = innerHeight, px = Math.max(2, Math.round(h / 330));
    document.documentElement.style.setProperty('--px', px + 'px');
    document.documentElement.style.setProperty('--u', Math.max(12, Math.round(h / 45)) + 'px');
    const s = Math.max(w / 1920, h / 1080);
    art.style.transform = 'translate(' + Math.round((w - 1920 * s) / 2) + 'px,' + Math.round((h - 1080 * s) / 2) + 'px) scale(' + s + ')';
    cv.width = w; cv.height = h; g.imageSmoothingEnabled = false;
  };
  addEventListener('resize', fit); fit();

  // ── Funken (30 Hz, ganze Pixelzellen) ──
  const cols = ['#f29a3e', '#fad54a', '#f7f7ad', '#fe5154', '#ffffff'];
  const P = []; const N = 70;
  const mk = (init) => ({ x: Math.random() * innerWidth, y: init ? Math.random() * innerHeight : innerHeight + 10, v: 0.6 + Math.random() * 1.6, dx: (Math.random() - 0.5) * 0.5, c: cols[Math.floor(Math.random() * cols.length)], s: Math.random() < 0.25 ? 2 : 1, ph: Math.random() * 60 });
  for (let i = 0; i < N; i++) P.push(mk(true));
  setInterval(() => {
    const c = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--px'), 10) || 3;
    g.clearRect(0, 0, cv.width, cv.height);
    for (const p of P) {
      p.y -= p.v * c * 0.5; p.x += p.dx * c * 0.4 + Math.sin((p.y + p.ph) / 30) * 0.6;
      if (p.y < -10) Object.assign(p, mk(false));
      g.fillStyle = p.c; g.fillRect(Math.round(p.x / c) * c, Math.round(p.y / c) * c, p.s * c, p.s * c);
    }
  }, 33);

  // ── Inhalt ──
  let cfg = { links: {} };
  const open = (u) => u && L.openExternal(u);
  L.config().then(c => {
    cfg = c || cfg;
    $('ver').textContent = 'v' + (cfg.version || '?') + (cfg.serverUrl ? '  ·  ' + cfg.serverUrl.replace(/^https?:\/\//, '') : '');
    const lk = cfg.links || {};
    for (const [id, key] of [['b-discord', 'discord'], ['b-itch', 'itch'], ['b-web', 'website']]) if (lk[key]) { $(id).hidden = false; $(id).onclick = () => open(lk[key]); }
    if (lk.discord) { $('pitch').hidden = false; $('pitch').onclick = () => open(lk.discord); }
  });

  // ── Serverstatus (Hauptprozess; wach halten, falls der Server schläft) ──
  const st = $('status');
  const poll = async () => {
    let r; try { r = await L.status(); } catch { r = { state: 'bad' }; }
    st.className = 'status ' + (r.state === 'ok' ? 'ok' : r.state === 'wake' ? 'wake' : 'bad');
    $('stxt').textContent = r.state === 'ok' ? 'Server online' + (r.ms ? ' · ' + r.ms + ' ms' : '') : r.state === 'wake' ? 'Waking up the server…' : 'Server not reachable';
    setTimeout(poll, r.state === 'ok' ? 20000 : 4000);
  };
  poll();

  // ── Musik (Titelmusik des Spiels); Wahl „aus“ bleibt gespeichert ──
  const bgm = $('bgm'); bgm.volume = 0.55;
  let muted = false; try { muted = localStorage.getItem('ppLauncherMuted') === '1'; } catch {}
  const showMusic = () => { $('b-music').textContent = muted ? 'MUSIC: OFF' : 'MUSIC: ON'; };
  const startMusic = () => { if (!muted) bgm.play().catch(() => {}); };
  showMusic(); startMusic();
  for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { if (bgm.paused) startMusic(); }, { once: false });
  $('b-music').onclick = () => {
    muted = !muted; try { localStorage.setItem('ppLauncherMuted', muted ? '1' : '0'); } catch {}
    if (muted) bgm.pause(); else startMusic();
    showMusic();
  };

  // ── Knöpfe ──
  let going = false;
  const play = () => {
    if (going) return; going = true;
    $('go').classList.add('on');
    setTimeout(() => { $('gos').textContent = 'Still connecting… the server may be waking up, this can take a moment.'; }, 6000);
    L.play();
  };
  if (L.onPlayFailed) L.onPlayFailed(() => {
    going = false; $('go').classList.remove('on');
    $('stxt').textContent = 'Server not reachable — please try again';
  });
  $('play').onclick = play;
  $('b-full').onclick = () => L.toggleFullscreen();
  $('b-quit').onclick = () => L.quit();
  addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } else if (e.key === 'F11') { e.preventDefault(); L.toggleFullscreen(); } });
})();
</script>
</body>
</html>
